
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>University of Vert | Logout</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --vert-green: #174C38;
            --dark-green: #103829;
            --champagne: #D4B878;
            --light-bg: #F5F7F6;
        }

        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--light-bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-card {
            width: 100%;
            max-width: 470px;
            background: white;
            border-radius: 18px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.07);
        }

        .brand-logo {
            width: 65px;
            height: 65px;
            border-radius: 17px;
            background: var(--champagne);
            color: var(--vert-green);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            margin: 0 auto 15px;
        }

        .brand-name {
            color: var(--vert-green);
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand-subtitle {
            color: #87918B;
            font-size: 11px;
        }

        .logout-icon {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: #EAF3EE;
            color: var(--vert-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin: 35px auto 22px;
        }

        .logout-title {
            color: var(--dark-green);
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .logout-description {
            color: #7A8580;
            font-size: 14px;
            line-height: 1.7;
        }

        .btn-login {
            background: var(--vert-green);
            color: white;
            border: none;
            border-radius: 9px;
            padding: 13px 25px;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: var(--dark-green);
            color: var(--champagne);
        }

        .redirect-text {
            color: #9AA39E;
            font-size: 12px;
            margin-top: 20px;
        }

        .redirect-text span {
            color: var(--vert-green);
            font-weight: 700;
        }

        .footer-text {
            color: #A0AAA4;
            font-size: 11px;
            margin-top: 35px;
        }
    </style>
</head>

<body>

    <div class="logout-card">

        <!-- University Logo -->
        <div class="brand-logo">
            <i class="bi bi-mortarboard-fill"></i>
        </div>

        <div class="brand-name">
            UNIVERSITY OF VERT
        </div>

        <div class="brand-subtitle">
            STUDENT MANAGEMENT SYSTEM
        </div>

        <!-- Logout Icon -->
        <div class="logout-icon">
            <i class="bi bi-check-lg"></i>
        </div>

        <!-- Logout Message -->
        <h2 class="logout-title">
            Successfully Logged Out!
        </h2>

        <p class="logout-description">
            You have safely logged out of your account.
            Thank you for using the University of Vert
            Student Management System.
        </p>

        <!-- Login Button -->
        <a href="login.html" class="btn btn-login">
            <i class="bi bi-box-arrow-in-right me-2"></i>
            Back to Login
        </a>

        <p class="redirect-text">
            Redirecting to login page in
            <span id="countdown">3</span> seconds...
        </p>

        <div class="footer-text">
            &copy; 2026 University of Vert. All Rights Reserved.
        </div>

    </div>

    <script>
        // Clear only the current login session
        localStorage.removeItem("gc_current_user");

        // Automatic redirect countdown
        let seconds = 3;

        const countdown = document.getElementById("countdown");

        const timer = setInterval(function () {

            seconds--;

            countdown.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(timer);
                window.location.replace("login.html");
            }

        }, 1000);
    </script>

</body>
</html>
